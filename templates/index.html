<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>IG 台灣 KOL 過濾器</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: linear-gradient(135deg, #f8f0ff 0%, #fce4f5 100%); min-height: 100vh; }
    .card { background: white; border-radius: 20px; box-shadow: 0 4px 24px rgba(180,80,180,0.10); }
    .btn-main { background: linear-gradient(90deg, #c026d3, #a21caf); color: white; border-radius: 12px; font-weight: 600; }
    .btn-main:active { opacity: 0.85; }
    .btn-cancel { background: #f3f4f6; color: #6b7280; border-radius: 12px; font-weight: 600; }
    .result-card { border: 1px solid #f3e8ff; border-radius: 14px; transition: box-shadow 0.15s; }
    .result-card:active { box-shadow: 0 2px 12px rgba(180,80,180,0.15); }
    .badge { background: #f3e8ff; color: #a21caf; border-radius: 6px; font-size: 12px; padding: 2px 8px; }
    .badge-verified { background: #dbeafe; color: #1d4ed8; }
    .progress-bar { height: 6px; background: #f3e8ff; border-radius: 3px; overflow: hidden; }
    .progress-fill { height: 100%; background: linear-gradient(90deg, #c026d3, #a21caf); border-radius: 3px; transition: width 0.3s; }
    input[type=password], input[type=text], input[type=number] {
      border: 1.5px solid #e9d5ff; border-radius: 10px; padding: 12px 14px;
      width: 100%; font-size: 16px; outline: none; background: #faf5ff;
    }
    input:focus { border-color: #c026d3; background: white; }
    label { font-size: 13px; font-weight: 600; color: #6b21a8; margin-bottom: 4px; display: block; }
    .avatar { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; background: #f3e8ff; }
  </style>
</head>
<body class="p-4 pb-10">

  <!-- Header -->
  <div class="text-center pt-6 pb-4">
    <div class="text-4xl mb-1">🇹🇼</div>
    <h1 class="text-xl font-bold text-purple-900">IG 台灣 KOL 過濾器</h1>
    <p class="text-sm text-purple-400 mt-1">找出你追蹤的台灣人中粉絲 &gt; 5 萬的帳號</p>
  </div>

  <!-- Login Form -->
  <div id="formSection" class="card p-5 mb-4">
    <div class="mb-4">
      <label>Instagram 帳號</label>
      <input type="text" id="username" placeholder="輸入你的 IG 帳號（不含 @）"
        autocomplete="username" autocorrect="off" autocapitalize="none" />
    </div>
    <div class="mb-4">
      <label>密碼</label>
      <input type="password" id="password" placeholder="輸入密碼" autocomplete="current-password" />
      <p class="text-xs text-gray-400 mt-1">密碼僅用於登入，不會被儲存</p>
    </div>

    <!-- Advanced -->
    <details class="mb-4">
      <summary class="text-sm text-purple-600 font-semibold cursor-pointer">進階設定</summary>
      <div class="mt-3 space-y-3">
        <div>
          <label>最低粉絲數門檻</label>
          <input type="number" id="minFollowers" value="50000" min="1000" step="1000" />
        </div>
        <label class="flex items-center gap-2 cursor-pointer">
          <input type="checkbox" id="taiwanOnly" checked class="w-4 h-4 accent-purple-600" />
          <span class="text-sm text-gray-700">只顯示台灣帳號</span>
        </label>
      </div>
    </details>

    <button onclick="startFilter()" class="btn-main w-full py-3 text-base">
      開始過濾
    </button>
  </div>

  <!-- 2FA Section -->
  <div id="tfaSection" class="card p-5 mb-4 hidden">
    <p class="text-sm font-semibold text-purple-900 mb-3">📱 需要雙重驗證碼</p>
    <p class="text-xs text-gray-500 mb-3">請開啟 Instagram 驗證器 App 或簡訊，輸入 6 位數驗證碼：</p>
    <input type="text" id="tfaCode" placeholder="123456" maxlength="6" inputmode="numeric"
      class="mb-3 text-center text-xl tracking-widest" />
    <button onclick="submitTfa()" class="btn-main w-full py-3">送出驗證碼</button>
  </div>

  <!-- Progress Section -->
  <div id="progressSection" class="card p-5 mb-4 hidden">
    <div class="flex items-center justify-between mb-2">
      <span class="text-sm font-semibold text-purple-800">掃描中...</span>
      <button onclick="cancelJob()" class="btn-cancel text-xs px-3 py-1">取消</button>
    </div>
    <div class="progress-bar mb-3">
      <div class="progress-fill" id="progressFill" style="width: 0%"></div>
    </div>
    <p id="progressText" class="text-xs text-gray-500 truncate">準備中...</p>
    <p class="text-xs text-purple-600 mt-2">已找到 <span id="foundCount" class="font-bold">0</span> 個符合帳號</p>
  </div>

  <!-- Results Section -->
  <div id="resultsSection" class="hidden">
    <div class="flex items-center justify-between mb-3">
      <h2 class="font-bold text-purple-900">結果 <span id="resultCount" class="text-purple-500"></span></h2>
      <button onclick="resetForm()" class="text-sm text-purple-600 font-semibold">重新搜尋</button>
    </div>
    <div id="resultsList" class="space-y-3"></div>
  </div>

  <!-- Error Section -->
  <div id="errorSection" class="card p-5 mb-4 hidden bg-red-50 border border-red-200">
    <p class="text-red-700 font-semibold text-sm">❌ 發生錯誤</p>
    <p id="errorText" class="text-red-600 text-sm mt-1"></p>
    <button onclick="resetForm()" class="btn-main w-full py-2 mt-3 text-sm">重試</button>
  </div>

<script>
let currentJobId = null;
let pollInterval = null;
let pendingUsername = null;
let pendingPassword = null;

function startFilter() {
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  if (!username || !password) { alert('請輸入帳號和密碼'); return; }
  pendingUsername = username;
  pendingPassword = password;
  submitLogin(username, password, null);
}

function submitLogin(username, password, twoFaCode) {
  const minFollowers = parseInt(document.getElementById('minFollowers').value) || 50000;
  const taiwanOnly = document.getElementById('taiwanOnly').checked;

  document.getElementById('formSection').classList.add('hidden');
  document.getElementById('tfaSection').classList.add('hidden');
  document.getElementById('progressSection').classList.remove('hidden');

  fetch('/start', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username, password, two_fa_code: twoFaCode, min_followers: minFollowers, taiwan_only: taiwanOnly })
  })
  .then(r => r.json())
  .then(data => {
    if (data.error) { showError(data.error); return; }
    currentJobId = data.job_id;
    startPolling();
  })
  .catch(() => showError('無法連線，請稍後再試'));
}

function submitTfa() {
  const code = document.getElementById('tfaCode').value.trim();
  if (!code) { alert('請輸入驗證碼'); return; }
  submitLogin(pendingUsername, pendingPassword, code);
}

function startPolling() {
  if (pollInterval) clearInterval(pollInterval);
  pollInterval = setInterval(pollStatus, 2000);
}

function pollStatus() {
  if (!currentJobId) return;
  fetch(`/status/${currentJobId}`)
    .then(r => r.json())
    .then(data => {
      const text = data.progress || '';
      document.getElementById('progressText').textContent = text;
      document.getElementById('foundCount').textContent = data.count || 0;

      const match = text.match(/(\d+)%/);
      if (match) document.getElementById('progressFill').style.width = match[1] + '%';

      if (data.needs_2fa) {
        clearInterval(pollInterval);
        document.getElementById('progressSection').classList.add('hidden');
        document.getElementById('tfaSection').classList.remove('hidden');
        return;
      }
      if (data.status === 'error') {
        clearInterval(pollInterval);
        showError(data.error);
        return;
      }
      if (data.status === 'done') {
        clearInterval(pollInterval);
        document.getElementById('progressFill').style.width = '100%';
        setTimeout(() => showResults(data.results), 300);
      }
    })
    .catch(() => {});
}

function showResults(results) {
  document.getElementById('progressSection').classList.add('hidden');
  document.getElementById('resultsSection').classList.remove('hidden');
  document.getElementById('resultCount').textContent = `（${results.length} 個）`;

  const list = document.getElementById('resultsList');
  list.innerHTML = '';

  if (results.length === 0) {
    list.innerHTML = '<div class="text-center text-gray-400 py-8">沒有找到符合條件的帳號</div>';
    return;
  }

  results.forEach(r => {
    const followers = r.followers >= 1000000
      ? (r.followers / 1000000).toFixed(1) + 'M'
      : r.followers >= 1000
      ? (r.followers / 1000).toFixed(1) + 'K'
      : r.followers;

    const el = document.createElement('a');
    el.href = r.url;
    el.target = '_blank';
    el.rel = 'noopener noreferrer';
    el.className = 'result-card p-4 flex gap-3 bg-white block';
    el.innerHTML = `
      <img src="${r.profile_pic || ''}" class="avatar flex-shrink-0" onerror="this.style.display='none'" />
      <div class="flex-1 min-w-0">
        <div class="flex items-center gap-2 flex-wrap">
          <span class="font-bold text-gray-900">@${r.username}</span>
          ${r.is_verified ? '<span class="badge badge-verified">✓ 認證</span>' : ''}
          <span class="badge ml-auto">${followers} 粉絲</span>
        </div>
        ${r.full_name ? `<p class="text-sm text-gray-600 mt-0.5">${r.full_name}</p>` : ''}
        ${r.biography ? `<p class="text-xs text-gray-400 mt-1 line-clamp-2">${r.biography}</p>` : ''}
      </div>
    `;
    list.appendChild(el);
  });
}

function showError(msg) {
  document.getElementById('progressSection').classList.add('hidden');
  document.getElementById('tfaSection').classList.add('hidden');
  document.getElementById('formSection').classList.add('hidden');
  document.getElementById('errorSection').classList.remove('hidden');
  document.getElementById('errorText').textContent = msg;
}

function cancelJob() {
  if (currentJobId) fetch(`/cancel/${currentJobId}`, { method: 'POST' });
  clearInterval(pollInterval);
  resetForm();
}

function resetForm() {
  clearInterval(pollInterval);
  currentJobId = null;
  document.getElementById('formSection').classList.remove('hidden');
  document.getElementById('progressSection').classList.add('hidden');
  document.getElementById('resultsSection').classList.add('hidden');
  document.getElementById('errorSection').classList.add('hidden');
  document.getElementById('tfaSection').classList.add('hidden');
  document.getElementById('progressFill').style.width = '0%';
  document.getElementById('resultsList').innerHTML = '';
  document.getElementById('tfaCode').value = '';
}
</script>
</body>
</html>
